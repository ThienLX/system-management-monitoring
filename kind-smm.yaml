kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: smm-dev
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30300  # Grafana NodePort
        hostPort: 30300
      - containerPort: 30900  # Prometheus NodePort
        hostPort: 30900
      - containerPort: 30903  # Alertmanager NodePort
        hostPort: 30903